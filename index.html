<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI or... Human?</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121214; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e24; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none; }
        button { background: #6200ee; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 5px; }
        button:hover { background: #3700b3; }
        #chat-box { height: 300px; border: 1px solid #333; overflow-y: auto; background: #000; border-radius: 6px; padding: 10px; text-align: left; margin: 15px 0; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 4px; }
        .me { background: #2e2e3a; text-align: right; }
        .them { background: #6200ee; }
        #timer { font-size: 24px; font-weight: bold; color: #ff3333; margin: 10px 0; }
        input { width: 75%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI or... Human? 🤖</h1>
    
    <!-- LOBBY SCREEN -->
    <div id="lobby">
        <p>Choose your round time limit to find a match:</p>
        <button onclick="joinGame('5min')">5 Minute Mode</button>
        <button onclick="joinGame('10min')">10 Minute Mode</button>
    </div>

    <!-- WAITING SCREEN -->
    <div id="waiting" class="hidden">
        <p>Looking for an opponent... Please wait.</p>
    </div>

    <!-- GAME SCREEN -->
    <div id="game" class="hidden">
        <h3 id="role-display">Your Role: </h3>
        <div id="timer">05:00</div>
        <div id="chat-box"></div>
        
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>

        <!-- DETECTIVE VERDICT CONTROLS -->
        <div id="detective-controls" class="hidden" style="margin-top: 15px;">
            <p>What is your final verdict?</p>
            <button onclick="sendVerdict('ai')" style="background: #cf6679;">They are acting like an AI!</button>
            <button onclick="sendVerdict('human')" style="background: #03dac6; color: black;">They are acting like a normal Human!</button>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over" class="hidden">
        <h2>Game Over!</h2>
        <p id="result-text"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
    let ws;
    let myRole = "";
    let countdown;

    function joinGame(mode) {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('waiting').classList.remove('hidden');

        // Connect to the local server node
        ws = new WebSocket('ws://localhost:8080');

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'join', mode: mode }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'waiting') {
                // Kept in lobby queue
            } 
            else if (data.type === 'start') {
                myRole = data.role;
                document.getElementById('waiting').classList.add('hidden');
                document.getElementById('game').classList.remove('hidden');
                document.getElementById('role-display').innerText = `Your Role: ${myRole}`;
                
                if (myRole === 'Detective') {
                    document.getElementById('detective-controls').classList.remove('hidden');
                }

                // Start the 5-min or 10-min countdown timer
                let totalSeconds = data.mode === '5min' ? 5 * 60 : 10 * 60;
                startTimer(totalSeconds);
            } 
            else if (data.type === 'chat') {
                appendMessage(data.text, 'them');
            } 
            else if (data.type === 'gameover') {
                clearInterval(countdown);
                document.getElementById('game').classList.add('hidden');
                document.getElementById('game-over').classList.remove('hidden');
                
                if(data.correct) {
                    document.getElementById('result-text').innerText = `The Detective correctly spotted the fake AI trick!`;
                } else {
                    document.getElementById('result-text').innerText = `The Fake AI successfully fooled the Detective!`;
                }
            }
            else if (data.type === 'disconnected') {
                alert("Opponent left the room.");
                location.reload();
            }
        };
    }

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById('timer');
        countdown = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.innerText = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(countdown);
                if (myRole === 'Detective') {
                    // Force a guess if time runs completely out
                    sendVerdict('human');
                }
            }
        }, 1000);
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (!input.value.trim()) return;

        ws.send(JSON.stringify({ type: 'chat', text: input.value }));
        appendMessage(input.value, 'me');
        input.value = "";
    }

    function appendMessage(text, sender) {
        const box = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerText = text;
        box.appendChild(msgDiv);
        box.scrollTop = box.scrollHeight;
    }

    function sendVerdict(choice) {
        ws.send(JSON.stringify({ type: 'verdict', verdict: choice }));
    }
</script>
</body>
</html>
